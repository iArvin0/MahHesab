name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bot.py finance.py smoke_test.py
      - run: python smoke_test.py
      - name: Validate Compose and build the image
        env:
          TELEGRAM_BOT_TOKEN: "123456:offline-check"
        run: |
          docker compose config --quiet
          docker compose build
